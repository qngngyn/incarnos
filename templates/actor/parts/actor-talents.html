<ol class="items-list talents-list">
  <li class="item flexrow items-header">
    <div class="item-name">Race &amp; Talents</div>
    <div class="talent-description">Description</div>
    <div class="item-controls">
      <a class="item-control item-create" data-action="itemCreate" title="Create talent" data-type="feature"><i class="fas fa-plus"></i> Add talent</a>
    </div>
  </li>
  {{#each talents as |item id|}}
    <li class="item flexrow draggable" data-item-id="{{item._id}}">
      <div class="item-name">
        <div class="item-image">
          <a class="rollable" data-action="roll" data-roll-type="item"><img src="{{item.img}}" title="{{item.name}}" width="24" height="24"/></a>
        </div>
        <h4 class="item-toggle" data-action="itemToggle" data-tooltip="{{localize 'INCARNOS.ItemSummary.toggle'}}">{{item.name}}{{#if item.isRace}} <span class="race-tag">Race</span>{{/if}} {{> "systems/incarnos/templates/item/item-sync-marker.html" item}}</h4>
      </div>
      <div class="talent-description item-prop">{{{item.descriptionHTML}}}</div>
      <div class="item-controls">
        <a class="item-control item-edit" data-action="itemEdit" title="Edit {{#if item.isRace}}Race{{else}}Talent{{/if}}"><i class="fas fa-edit"></i></a>
        <a class="item-control item-delete" data-action="itemDelete" title="Delete {{#if item.isRace}}Race{{else}}Talent{{/if}}"><i class="fas fa-trash"></i></a>
      </div>
    </li>
  {{/each}}
</ol>
